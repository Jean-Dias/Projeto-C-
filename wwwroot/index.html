<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mercadinho da Esquina</title>
    <style>
        body { font-family: Arial; margin: 2em; }
        h1 { color: #3b82f6; }
        button { margin-bottom: 10px; padding: 8px; background-color: #3b82f6; color: white; border: none; border-radius: 5px; }
        ul { list-style: none; padding-left: 0; }
        li { background: #f0f0f0; margin: 5px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Mercadinho da Esquina</h1>
    <button onclick="carregarProdutos()">Carregar Produtos</button>
    <ul id="lista-produtos"></ul>

    <script>
        async function carregarProdutos() {
            const resposta = await fetch('/produtos');
            const produtos = await resposta.json();
            const lista = document.getElementById('lista-produtos');
            lista.innerHTML = '';

            produtos.forEach(p => {
                const item = document.createElement('li');
                item.innerText = `${p.nome} - R$ ${p.preco} (${p.quantidade} unidades) | Fornecedor: ${p.fornecedor}`;
                lista.appendChild(item);
            });
        }
    </script>
</body>
</html>
