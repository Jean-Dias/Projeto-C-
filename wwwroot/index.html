<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mercadinho da Esquina</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>🏪 Mercadinho da Esquina</h1>
    
    <div class="container">
        <!-- PRODUTOS -->
        <div class="section">
            <h2>📦 Produtos</h2>
            
            <!-- Pesquisa -->
            <form class="search">
                <label>🔍 Pesquisar Produto:</label>
                <input type="text" id="search-produto" placeholder="Digite o nome do produto...">
            </form>
            
            <!-- Cadastro -->
            <form id="form-produto">
                <label>Nome:</label>
                <input type="text" id="nome" required>
                <label>Preço:</label>
                <input type="number" step="0.01" id="preco" required min="0">
                <label>Quantidade:</label>
                <input type="number" id="quantidade" required min="0">
                <label>Fornecedor:</label>
                <input type="text" id="fornecedor" required>
                <button type="submit">Cadastrar Produto</button>
            </form>
            
            <button id="btn-toggle-produtos">Mostrar Produtos</button>
            <ul id="lista-produtos" class="hidden"></ul>
        </div>

        <!-- FORNECEDORES -->
        <div class="section">
            <h2>🏢 Fornecedores</h2>
            
            <!-- Pesquisa -->
            <form class="search">
                <label>🔍 Pesquisar Fornecedor:</label>
                <input type="text" id="search-fornecedor" placeholder="Digite o nome do fornecedor...">
            </form>
            
            <!-- Cadastro -->
            <form id="form-fornecedor">
                <label>Nome:</label>
                <input type="text" id="nome-fornecedor" required>
                <label>CNPJ:</label>
                <input type="text" id="cnpj-fornecedor" placeholder="Deixe em branco para gerar automático">
                <button type="submit">Cadastrar Fornecedor</button>
            </form>
            
            <button id="btn-toggle-fornecedores">Mostrar Fornecedores</button>
            <ul id="lista-fornecedores" class="hidden"></ul>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
