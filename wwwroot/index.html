<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Mercadinho da Esquina</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <h1>Mercadinho da Esquina</h1>

    <section>
        <h2>Produtos</h2>
        <form id="form-produto">
            <label>Nome:
                <input type="text" id="nome" required />
            </label>
            <label>Preço:
                <input type="number" step="0.01" id="preco" required />
            </label>
            <label>Quantidade:
                <input type="number" id="quantidade" required />
            </label>
            <label>Fornecedor:
                <input type="text" id="fornecedor" required />
            </label>
            <button type="submit">Salvar Produto</button>
        </form>

        <button id="btn-toggle-produtos" style="margin-top: 10px;">Mostrar Produtos</button>

        <ul id="lista-produtos" style="display:none; margin-top: 10px;"></ul>
    </section>

    <section>
        <h2>Fornecedores</h2>
        <form id="form-fornecedor">
            <label>Nome:
                <input type="text" id="nome-fornecedor" required />
            </label>
            <label>Contato:
                <input type="text" id="contato-fornecedor" required />
            </label>
            <button type="submit">Salvar Fornecedor</button>
        </form>

        <button id="btn-toggle-fornecedores" style="margin-top: 10px;">Mostrar Fornecedores</button>

        <ul id="lista-fornecedores" style="display:none; margin-top: 10px;"></ul>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
